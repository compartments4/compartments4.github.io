<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Record B — The Count</title>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0b1a22;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }

    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-attrib { display: none !important; }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(5,14,20,0.72) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* ── COUNTER ──────────────────────────────────────── */
    #counter-block {
      position: absolute;
      top: 50%;
      right: 140px;
      transform: translateY(-50%);
      text-align: right;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #counter-block.visible { opacity: 1; }
    #counter-num {
      font-size: 160px;
      font-weight: 900;
      color: #ff0000;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 60px rgba(217,255,0,0.20), 0 0 120px rgba(217,255,0,0.10);
      transition: color 0.8s ease, text-shadow 0.8s ease;
    }
    #counter-label {
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-top: 10px;
    }
    #counter-fraction {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.22);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ── FLASH RING ────────────────────────────────────── */
    #flash-ring {
      position: absolute;
      width: 0; height: 0;
      border-radius: 50%;
      border: 2px solid #ff0000;
      opacity: 0;
      transform: translate(-50%, -50%);
      z-index: 40;
      pointer-events: none;
    }
    @keyframes ring-pulse {
      0%   { width: 0px;  height: 0px;  opacity: 0.75; }
      100% { width: 64px; height: 64px; opacity: 0; }
    }
    #flash-ring.pulse { animation: ring-pulse 0.45s ease-out forwards; }

    /* ── END CARD ─────────────────────────────────────── */
    #silence-card {
      position: absolute;
      left: 90px;
      bottom: 90px;
      z-index: 80;
      pointer-events: none;
    }
    #silence-eyebrow {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ff0000;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    #silence-line1, #silence-line2 {
      font-size: 76px;
      font-weight: 800;
      color: #fff;
      line-height: 1.05;
      display: block;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      letter-spacing: -0.02em;
    }
    #silence-sub {
      margin-top: 24px;
      font-size: 18px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .sc-visible { opacity: 1 !important; transform: translateY(0) !important; }

    /* ── PROGRESS / PHASE ─────────────────────────────── */
    #progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      background: #ff0000;
      width: 0%;
      z-index: 100;
      opacity: 0;
    }
    #phase-title {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
    }

    /* ── START SCREEN ─────────────────────────────────── */
    #start-screen {
      position: absolute;
      inset: 0;
      background: #0b1a22;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.8s ease;
    }
    #start-screen.fade-out { opacity: 0; pointer-events: none; }
    #start-screen h1 {
      font-size: 22px;
      font-weight: 300;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .seq-preview {
      display: flex;
      gap: 0;
      margin-bottom: 52px;
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .seq-step { padding: 16px 28px; border-right: 0.5px solid rgba(255,255,255,0.1); text-align: center; }
    .seq-step:last-child { border-right: none; }
    .seq-step .t { font-size: 11px; color: #d9ff00; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
    .seq-step .d { font-size: 13px; color: rgba(255,255,255,0.5); }
    #start-btn {
      padding: 16px 56px;
      background: rgba(217,255,0,0.15);
      border: 1.5px solid rgba(217,255,0,0.3);
      border-radius: 4px;
      color: rgba(255,255,255,0.35);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: not-allowed;
      transition: all 0.3s ease;
    }
    #start-btn.ready {
      background: #d9ff00;
      border-color: #d9ff00;
      color: #0b1a22;
      cursor: pointer;
    }
    #start-btn.ready:hover { opacity: 0.88; }
    #start-hint { margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.22); letter-spacing: 0.08em; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="vignette"></div>
  <div id="flash-ring"></div>

  <div id="counter-block">
    <div id="counter-num">0</div>
    <div id="counter-label">High-Risk Zones</div>
    <div id="counter-fraction">0 / 175</div>
  </div>

  <div id="silence-card">

  </div>

  <div id="phase-title"></div>
  <div id="progress"></div>

  <div id="start-screen">
    <h1 id="status-label">Loading map data…</h1>
    <div class="seq-preview">
      <div class="seq-step"><div class="t">0–0.5s</div><div class="d">Empty city outline</div></div>
      <div class="seq-step"><div class="t">0.5–6.5s</div><div class="d">Dots appear · counter ticks</div></div>
      <div class="seq-step"><div class="t">9s</div><div class="d">175 — silence</div></div>
      <div class="seq-step"><div class="t">10–13s</div><div class="d">End card · hold</div></div>
    </div>
    <button id="start-btn" onclick="begin()">Loading…</button>
    <div id="start-hint">Open fullscreen (F11) · Start your screen recorder · Then click</div>
  </div>

  <script>
  // ── TIMING (ms) — adjust to taste ──────────────────────
  const TOTAL_DOTS      = 175;
  const EMPTY_HOLD_MS   = 1000;   // blank city before first dot
  const DOT_PHASE_MS    = 6000;   // 1s → 9s: all dots appear
  const SILENCE_HOLD_MS = 900;    // pause after last dot
  const TOTAL_MS        = EMPTY_HOLD_MS + DOT_PHASE_MS + SILENCE_HOLD_MS + 3800;

  // Ease: slow start, fast middle, slow finish
  // Makes first ~10 dots feel deliberate, then accelerates, then slows to 175
  function ease(t) {
    return t < 0.5 ? 8*t*t*t*t : 1 - Math.pow(-2*t+2, 4)/2;
  }

  let allFeatures   = [];
  let shownCount    = 0;
  let startTime     = null;
  let seqFired      = new Set();
  let revealedCache = [];   // accumulating feature list for setData

  // ── MAP ─────────────────────────────────────────────────
  const map = new maplibregl.Map({
    container: 'map',
    style:     './datasets/project_intersect.json',
    center:    [77.58, 12.97],
    zoom:      10.39,
    bearing:   0, pitch: 0,
    interactive: false,
    attributionControl: false,
    fadeDuration: 0
  });

  map.on('load', async () => {

    // Boundaries
    map.addSource('gba-boundary', { type: 'geojson', data: './datasets/gba-boundary.geojson' });
    map.addSource('gba-zones',    { type: 'geojson', data: './datasets/gba-zones.geojson' });
    map.addSource('gba-wards',    { type: 'geojson', data: './datasets/gba-wards.geojson' });
    map.addLayer({ id: 'gba-boundary-line', type: 'line', source: 'gba-boundary',
      paint: { 'line-color': '#fff', 'line-width': 1.2, 'line-dasharray': [2,3], 'line-opacity': 0.5 }});
    map.addLayer({ id: 'gba-zones-line', type: 'line', source: 'gba-zones',
      paint: { 'line-color': '#fff', 'line-width': 0.8, 'line-opacity': 0.28 }});
    map.addLayer({ id: 'gba-wards-line', type: 'line', source: 'gba-wards',
      paint: { 'line-color': '#fff', 'line-width': 0.1, 'line-opacity': 0.2 }});

    // Road labels
    map.addSource('labels', { type: 'geojson', data: './datasets/labels.geojson' });
    map.addLayer({ id: 'labels-text', type: 'symbol', source: 'labels',
      layout: { 'symbol-placement': 'point', 'text-field': ['get', 'name'],
        'text-font': ['Open Sans Regular'], 'text-size': 12 },
      paint: { 'text-color': '#000', 'text-halo-color': '#d5e655', 'text-halo-width': 4 }
    });

    // Empty revealed-dots source
    map.addSource('revealed-dots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    map.addLayer({ id: 'revealed-fill', type: 'fill', source: 'revealed-dots',
      paint: { 'fill-color': '#ff0000', 'fill-opacity': 0.25 }});
    map.addLayer({ id: 'revealed-line', type: 'line', source: 'revealed-dots',
      paint: { 'line-color': '#ff0000', 'line-width': 2.5, 'line-opacity': 0.9 }});

    // Fetch + shuffle real features
    try {
      const res  = await fetch('./datasets/proposed-locations.geojson');
      const data = await res.json();
      allFeatures = shuffle(data.features || []).slice(0, TOTAL_DOTS);
    } catch(e) {
      console.error('Failed to load proposed-locations.geojson', e);
    }

    const btn = document.getElementById('start-btn');
    btn.textContent = '▶  Start — Hit Record First';
    btn.classList.add('ready');
    document.getElementById('status-label').textContent =
      `${allFeatures.length} zones loaded — ready`;
  });

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // ── DOT REVEAL ──────────────────────────────────────────
  function revealUpTo(target) {
    if (target <= shownCount) return;
    const newFeats = allFeatures.slice(shownCount, target);
    shownCount = target;
    revealedCache = revealedCache.concat(newFeats);
    map.getSource('revealed-dots').setData({
      type: 'FeatureCollection',
      features: revealedCache
    });
    // Flash ring on the last revealed feature
    if (newFeats.length > 0) flashAt(newFeats[newFeats.length - 1]);
    // Update counter
    document.getElementById('counter-num').textContent = shownCount;
    document.getElementById('counter-fraction').textContent = `${shownCount} / ${allFeatures.length}`;
  }

  function getCentroid(f) {
    try {
      const g = f.geometry;
      if (g.type === 'Point') return g.coordinates;
      const ring = g.type === 'Polygon' ? g.coordinates[0] : g.coordinates[0][0];
      return [
        ring.reduce((s,c) => s+c[0], 0) / ring.length,
        ring.reduce((s,c) => s+c[1], 0) / ring.length
      ];
    } catch(e) { return [77.58, 12.97]; }
  }

  function flashAt(feature) {
    const [lng, lat] = getCentroid(feature);
    const pt  = map.project([lng, lat]);
    const ring = document.getElementById('flash-ring');
    ring.classList.remove('pulse');
    ring.style.left = pt.x + 'px';
    ring.style.top  = pt.y + 'px';
    void ring.offsetWidth;
    ring.classList.add('pulse');
  }

  // ── SEQUENCE EVENTS ─────────────────────────────────────
  const SEQUENCE = [

    { at: EMPTY_HOLD_MS, run() {
      showPhase('Dots appearing');
      document.getElementById('counter-block').classList.add('visible');
    }},

    { at: EMPTY_HOLD_MS + DOT_PHASE_MS, run() {
      showPhase('175 — silence');
      const num = document.getElementById('counter-num');
      num.style.color = '#ffffff';
      num.style.textShadow = 'none';
    }},

    { at: EMPTY_HOLD_MS + DOT_PHASE_MS + SILENCE_HOLD_MS, run() {
      showPhase('End card');
      const cb = document.getElementById('counter-block');
      cb.style.transition = 'opacity 0.8s ease';
      cb.style.opacity = '0';
      [
        { id: 'silence-eyebrow', delay: 0   },
        { id: 'silence-line1',   delay: 200 },
        { id: 'silence-line2',   delay: 400 },
        { id: 'silence-sub',     delay: 680 },
      ].forEach(({ id, delay }) =>
        setTimeout(() => document.getElementById(id).classList.add('sc-visible'), delay)
      );
    }}
  ];

  // ── MAIN TICK ────────────────────────────────────────────
  function tick(now) {
    const elapsed = now - startTime;

    // Sequence events
    SEQUENCE.forEach((step, i) => {
      if (!seqFired.has(i) && elapsed >= step.at) { seqFired.add(i); step.run(); }
    });

    // Dot reveal — eased progress through DOT_PHASE_MS
    if (elapsed >= EMPTY_HOLD_MS && shownCount < allFeatures.length) {
      const t      = Math.min((elapsed - EMPTY_HOLD_MS) / DOT_PHASE_MS, 1);
      const target = Math.min(Math.floor(ease(t) * allFeatures.length), allFeatures.length);
      revealUpTo(target);
    }

    // Progress bar
    document.getElementById('progress').style.width =
      Math.min(elapsed / TOTAL_MS * 100, 100) + '%';

    if (elapsed < TOTAL_MS + 500) {
      requestAnimationFrame(tick);
    } else {
      document.getElementById('progress').style.background = '#00f82d';
      document.getElementById('phase-title').textContent = '✓ Done — stop recording';
      document.getElementById('phase-title').style.opacity = '0.5';
    }
  }

  function showPhase(label) {
    const el = document.getElementById('phase-title');
    el.textContent = label;
    el.style.opacity = '0.35';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
  }

  function begin() {
    const btn = document.getElementById('start-btn');
    if (!btn.classList.contains('ready')) return;
    const ss = document.getElementById('start-screen');
    ss.classList.add('fade-out');
    setTimeout(() => { ss.style.display = 'none'; }, 900);
    document.getElementById('progress').style.opacity = '1';
    startTime    = performance.now();
    shownCount   = 0;
    revealedCache = [];
    seqFired.clear();
    map.getSource('revealed-dots')?.setData({ type: 'FeatureCollection', features: [] });
    requestAnimationFrame(tick);
  }
  </script>
</body>
</html>
