<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Junction Detail</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>

        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="page.css" />

        <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    </head>

    <body>

        <header class="detail-header">
            <sl-button size="small" circle onclick="goBack()">
                <sl-icon name="arrow-left"></sl-icon>
            </sl-button>
            <div class="detail-header-titles">
                <h1 id="detail-title"></h1>
            </div>
        </header>

        <div class="detail-layout">

            <!-- Left: same info as panel -->
            <aside class="detail-left">

                <div class="panel-header-tags" id="panel-header-tags">
                    <sl-tag id="panel-tag-theme" size="small" data-tag="theme"></sl-tag>
                    <sl-tag id="panel-tag-theme-2" size="small" data-tag="theme"></sl-tag>
                </div>

                <div class="panel-fields">
                    <div class="panel-row" id="panel-row-id">
                        <span class="panel-label">ID</span>
                        <span class="panel-value" id="panel-val-id"></span>
                    </div>
                    <div class="panel-row" id="panel-row-hierarchy">
                        <span class="panel-label">Hierarchy</span>
                        <span class="panel-value" id="panel-val-hierarchy"></span>
                    </div>

                    <!-- budget row hidden; restore when needed
                    <div class="panel-row" id="panel-row-budget">
                        <span class="panel-label">Budget</span>
                        <span class="panel-value" id="panel-val-budget"></span>
                    </div>
                    -->
                </div>

                <sl-carousel class="panel-carousel" id="panel-carousel" navigation pagination loop mouse-dragging></sl-carousel>

                <div class="panel-fields" id="panel-crash-section">
                    <div class="panel-row" id="panel-row-crash-count">
                        <span class="panel-label">Crash Points</span>
                        <span class="panel-value" id="panel-val-crash-count"></span>
                    </div>
                    <div class="panel-row" id="panel-row-crash-patterns">
                        <span class="panel-label">Crash Patterns</span>
                        <div class="panel-tags" id="panel-val-crash-patterns"></div>
                    </div>
                </div>

                <div class="detail-vote">
                    <button id="detail-vote-btn">
                        <sl-icon name="hand-thumbs-up"></sl-icon>
                        <span id="detail-vote-label">Vote</span>
                        <span id="detail-vote-count"> · 0</span>
                    </button>
                </div>

            </aside>

            <!-- Right: data sections -->
            <section class="detail-right">

                <div class="detail-section">
                    <div class="detail-section-header">
                        <h2>Audit Data</h2>
                    </div>
                    <div class="detail-section-body" id="audit-data-body"></div>
                </div>

                <div class="detail-section" id="countermeasures-section">
                    <div class="detail-section-header">
                        <h2>Countermeasures</h2>
                        <sl-icon-button name="arrows-fullscreen" id="countermeasures-expand" label="Expand"></sl-icon-button>
                    </div>
                    <div class="detail-section-body" id="countermeasures-body"></div>
                </div>

            </section>

        </div>

        <sl-dialog id="countermeasures-dialog" label="Countermeasures" style="--width: 90vw;">
            <div id="countermeasures-body-expanded"></div>
        </sl-dialog>

        <script>
            function goBack() {
                if (document.referrer && document.referrer.includes('projectintersect.framer.website')) {
                    window.history.back();
                } else {
                    window.location.href = 'https://projectintersect.framer.website/dashboard';
                }
            }
        </script>
        <script src="panel-shared.js"></script>
        <script>
            const sb = window.supabase.createClient(
              'https://jmmzfsbnmadjyikimfpr.supabase.co',
              'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptbXpmc2JubWFkanlpa2ltZnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzE2OTYsImV4cCI6MjA5ODY0NzY5Nn0.csyO2f3D96l_vt9arq2IpGegklMiOAm2IxZiKKTbEYs'
            );

            async function initVotes(junctionId) {
              const storageKey = `voted:${junctionId}`;
              const btn     = document.getElementById('detail-vote-btn');
              const labelEl = document.getElementById('detail-vote-label');
              const countEl = document.getElementById('detail-vote-count');

              const { data } = await sb
                .from('junction_votes').select('count').eq('junction_id', junctionId).maybeSingle();
              let currentCount = data?.count ?? 0;
              countEl.textContent = ` · ${currentCount}`;

              if (localStorage.getItem(storageKey)) btn.classList.add('voted'), labelEl.textContent = 'Voted';

              btn.addEventListener('click', async () => {
                const voted = !!localStorage.getItem(storageKey);
                const newCount = voted ? Math.max(0, currentCount - 1) : currentCount + 1;
                const { error } = await sb
                  .from('junction_votes')
                  .upsert({ junction_id: junctionId, count: newCount }, { onConflict: 'junction_id' });
                if (error) { console.error('Vote failed:', error); return; }
                currentCount = newCount;
                countEl.textContent = ` · ${currentCount}`;
                if (voted) {
                  localStorage.removeItem(storageKey);
                  btn.classList.remove('voted');
                  labelEl.textContent = 'Vote';
                } else {
                  localStorage.setItem(storageKey, '1');
                  btn.classList.add('voted');
                  labelEl.textContent = 'Voted';
                }
              });
            }

            const AUDIT_FIELDS = [
                ['footpath', 'Footpath'], ['refuge_islands', 'Refuge Islands'], ['signals', 'Signals'],
                ['cctv', 'CCTV'], ['vehicular_light', 'Vehicular light'], ['lane_marking', 'Lane Marking'],
                ['pedestrian_crossing', 'Pedestrian Crossing'], ['median_island', 'Median Island'],
                ['table_top', 'Table top'], ['landscape', 'Landscape'], ['cat_eyes', 'Cat eyes'],
                ['traffic_police_chowk', 'Traffic police chowk'], ['street_furniture', 'Street furniture'],
                ['median', 'Median'], ['pavers', 'Pavers'], ['tactile_pavers', 'Tactile pavers'],
                ['rumble_strips', 'Rumble strips'], ['pedestrian_light', 'Pedestrian light'],
                ['signage', 'Signage'], ['pelican_signals', 'Pelican signals'],
                ['bus_stop_shifting', 'Shifting of bus stops'], ['autobays', 'Autobays'],
                ['cycle_track', 'Cycle track'], ['pickup_dropoff', 'Pick up and drop off'],
                ['pedestrian_only_zone', 'Pedestrian only zone'], ['tree_pits', 'Tree pits'],
                ['bollards', 'Bollards'],
            ];

            /**
             * categories.csv has one column per category, with each row holding the
             * next audit-field key for that category (ragged — shorter categories
             * leave trailing cells blank). Returns categories in header column order:
             * [{ name: 'Pedestrian Infrastructure', keys: ['footpath', ...] }, ...]
             */
            function parseCategoriesCsv(text) {
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                const names = parseCsvLine(lines[0]);
                const grouped = names.map(() => []);
                lines.slice(1).forEach(line => {
                    parseCsvLine(line).forEach((cell, i) => {
                        const v = cell.trim();
                        if (v) grouped[i].push(v);
                    });
                });
                return names.map((name, i) => ({ name, keys: grouped[i] }));
            }

            async function init() {
                const id = new URLSearchParams(location.search).get('id');
                const [junctionsRes, categoriesRes, crashPatternRes, analysisRes] = await Promise.all([
                    fetch('./datasets/175-junctions.csv'),
                    fetch('./datasets/categories.csv'),
                    fetch('./datasets/crash-pattern.csv'),
                    fetch('./datasets/crash-pattern-analysis.xlsx'),
                ]);
                const rows = parseCsv(await junctionsRes.text());
                const categories = parseCategoriesCsv(await categoriesRes.text());
                const crashPatternByUid = new Map(
                    parseCsv(await crashPatternRes.text()).map(r => [r['Unique ID'], r])
                );
                const analysisWorkbook = XLSX.read(await analysisRes.arrayBuffer(), { type: 'array' });
                const analysisSheet = analysisWorkbook.Sheets[analysisWorkbook.SheetNames[0]];
                const analysisByKey = parseCrashPatternAnalysis(XLSX.utils.sheet_to_json(analysisSheet, { header: 1 }));

                const matches = rows.filter(r => r.j_code === id);
                if (matches.length > 1) {
                    console.warn(`junction.html: multiple rows share j_code "${id}"; using the first.`);
                }
                const row = matches[0];

                if (!row) {
                    document.getElementById('detail-title').textContent = 'Junction not found';
                    document.querySelector('.detail-layout').innerHTML =
                        `<p style="padding:24px;color:#888;">No junction found for ID "${id ?? ''}".</p>`;
                    return;
                }

                const { theme, theme_2, j_name, j_code, road_hierarchy, budget, lat, long, crash_count } = row;
                const hierarchy = formatHierarchy(road_hierarchy);
                const budgetCategory = classifyBudget(budget);
                const name = j_name ? j_name.split(',').map(s => s.trim()).filter(s => s && s !== 'NULL').join(', ') : null;
                const crashPatterns = getCrashPatterns(row['Unique ID'], crashPatternByUid);
                const countermeasureRows = getCountermeasureRows(crashPatterns, analysisByKey);

                document.title = name || j_code || 'Junction Detail';
                document.getElementById('detail-title').textContent = name || j_code || '';

                setTag('panel-tag-theme', themeLabel(theme));
                setTag('panel-tag-theme-2', themeLabel(theme_2));
                document.getElementById('panel-header-tags').hidden = !theme && !theme_2;

                setRow('panel-row-id', 'panel-val-id', j_code);
                setRow('panel-row-hierarchy', 'panel-val-hierarchy', hierarchy);
                setRow('panel-row-budget', 'panel-val-budget', budgetCategory);

                document.getElementById('countermeasures-section').hidden = theme !== 'Crash';

                const carousel = document.getElementById('panel-carousel');
                carousel.innerHTML = '';
                buildStreetViewCarousel(parseFloat(lat), parseFloat(long), carousel);

                document.getElementById('panel-crash-section').hidden = crash_count == null && crashPatterns.length === 0;
                setRow('panel-row-crash-count', 'panel-val-crash-count', crash_count != null ? String(crash_count) : null);
                setTagRow('panel-row-crash-patterns', 'panel-val-crash-patterns', crashPatterns.join(','), 'crash-pattern');

                const cmCategoriesWithContent = COUNTERMEASURE_CATEGORIES.filter(
                    cat => countermeasureRows.some(r => r.countermeasures[cat].length)
                );
                const cmHtml = countermeasureRows.length === 0
                    ? '<p style="color:#888;">No countermeasures identified.</p>'
                    : `<div class="countermeasure-table-wrap">
                        <table class="countermeasure-table">
                            <thead>
                                <tr>
                                    <th>Type of Crash</th>
                                    <th>Context</th>
                                    ${cmCategoriesWithContent.map(cat => `<th>${cat}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${countermeasureRows.map(r => `
                                    <tr>
                                        <td>${r.type}</td>
                                        <td>${r.context}</td>
                                        ${cmCategoriesWithContent.map(cat => `
                                            <td>${r.countermeasures[cat].length
                                                ? `<ul class="countermeasure-list">${r.countermeasures[cat].map(item => `<li>${item}</li>`).join('')}</ul>`
                                                : '—'}</td>
                                        `).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;

                document.getElementById('countermeasures-body').innerHTML = cmHtml;
                document.getElementById('countermeasures-body-expanded').innerHTML = cmHtml;
                document.getElementById('countermeasures-expand').hidden = countermeasureRows.length === 0;
                document.getElementById('countermeasures-expand').addEventListener('click', () => {
                    document.getElementById('countermeasures-dialog').show();
                });

                await initVotes(j_code);

                const labelByKey = new Map(AUDIT_FIELDS);
                const auditBody = document.getElementById('audit-data-body');
                auditBody.innerHTML = `<div class="audit-categories">${categories.map(({ name, keys }) => `
                    <div class="audit-category">
                        <h3 class="audit-category-title">${name}</h3>
                        ${keys.map(key => {
                            const label = labelByKey.get(key) ?? key;
                            const isYes = ['yes', 'true'].includes(String(row[key]).trim().toLowerCase());
                            return `<div class="audit-row">
                                <span class="audit-label">${label}</span>
                                <span class="audit-badge ${isYes ? 'yes' : 'no'}">${isYes ? 'Yes' : 'No'}</span>
                            </div>`;
                        }).join('')}
                    </div>
                `).join('')}</div>`;
            }

            init();
        </script>

    </body>

</html>
