<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Intersect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f2530;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f1f5f9;
    }

    header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Sections ─────────────────────────────────────────── */

    .sections {
      display: flex;
      flex-direction: column;
      gap: 40px;
      width: 100%;
      max-width: 760px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 12px;
    }

    .cards {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ── Cards ────────────────────────────────────────────── */

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #143542;
      border: 1px solid rgba(209, 213, 219, 0.12);
      border-radius: 10px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      flex: 1;
      min-width: 200px;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      background: #1a4457;
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .card-icon.blue   { background: rgba(56, 189, 248, 0.15); }
    .card-icon.green  { background: rgba(52, 211, 153, 0.15); }
    .card-icon.amber  { background: rgba(251, 191, 36, 0.15); }
    .card-icon.purple { background: rgba(167, 139, 250, 0.15); }

    .card-text strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 2px;
    }

    .card-text span {
      font-size: 12px;
      color: #64748b;
    }

    /* ── Chapter cards (stacked, full-width) ─────────────── */

    .cards.stacked {
      flex-direction: column;
    }

    .cards.stacked .card {
      min-width: unset;
    }

    .card-arrow {
      margin-left: auto;
      color: #334155;
      font-size: 16px;
      transition: color 0.15s;
    }

    .card:hover .card-arrow {
      color: #38bdf8;
    }

    /* ── Coming soon ──────────────────────────────────────── */

    .card.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(100, 116, 139, 0.2);
      color: #64748b;
      border-radius: 4px;
      padding: 2px 7px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Project Intersect</h1>
    <p>Bengaluru Road Safety Initiative</p>
  </header>

  <div class="sections">

    <!-- Dashboard -->
    <div>
      <div class="section-label">Dashboard</div>
      <div class="cards">
        <a class="card" href="index.html">
          <div class="card-icon blue">🗺</div>
          <div class="card-text">
            <strong>City Map</strong>
            <span>Interactive priority locations map</span>
          </div>
          <span class="card-arrow">›</span>
        </a>
      </div>
    </div>

    <!-- Hero -->
    <div>
      <div class="section-label">Hero</div>
      <div class="cards">
        <a class="card" href="hero-record.html">
          <div class="card-icon amber">🎬</div>
          <div class="card-text">
            <strong>Hero A</strong>
            <span>Animated map sequence</span>
          </div>
          <span class="card-arrow">›</span>
        </a>
        <a class="card" href="hero-record-b.html">
          <div class="card-icon amber">🎬</div>
          <div class="card-text">
            <strong>Hero B</strong>
            <span>Alternate animation variant</span>
          </div>
          <span class="card-arrow">›</span>
        </a>
      </div>
    </div>

    <!-- Chapters -->
    <div>
      <div class="section-label">Chapters</div>
      <div class="cards stacked">
        <a class="card" href="chapters/template/index.html">
          <div class="card-icon green">📖</div>
          <div class="card-text">
            <strong>Template</strong>
            <span>Starter story map</span>
          </div>
          <span class="card-arrow">›</span>
        </a>
        <a class="card" href="chapters/ch01-south-nh44/index.html">
          <div class="card-icon green">01</div>
          <div class="card-text">
            <strong>South NH 44</strong>
            <span>Story map — Chapter 1</span>
          </div>
          <span class="card-arrow">›</span>
        </a>
        <!-- Add new chapters below this line -->
      </div>
    </div>

  </div>

</body>

</html>
